name: Synthetic replay checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m agent_reliability run --config configs/experiment.json --output artifacts/ci
      - run: python -m agent_reliability report --input artifacts/ci/report.json --output artifacts/ci/report.html
